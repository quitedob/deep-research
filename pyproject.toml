[project]
name = "deep-research"
version = "1.0.0"
description = "Authenticated chat and deep research with DeepSeek multimodal models"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "database: requires local PostgreSQL and creates an isolated temporary schema",
  "live: manually enabled paid/external provider integration",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
